version: '3.8'

services:
  # Servicio de Base de Datos (MongoDB)
  mongo:
    image: mongo:latest
    container_name: catalogo_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: catalogobulk
    volumes:
      - mongo_data:/data/db

  # Servicio de Caché y Cola de Mensajes (Redis)
  redis:
    image: redis:alpine
    container_name: catalogo_redis
    restart: always
    ports:
      - "6379:6379"

  # Servicio Backend / API Express
  api:
    build: .
    container_name: catalogo_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/catalogobulk
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo_data: